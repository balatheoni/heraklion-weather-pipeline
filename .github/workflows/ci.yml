name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    
cron: '0 6 * * 1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      
uses: actions/checkout@v4
uses: actions/setup-python@v5
with:
      python-version: '3.11'
run: pip install ruff
run: ruff check .

pipeline:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      
uses: actions/checkout@v4
uses: actions/setup-python@v5
with:
      python-version: '3.11'
      cache: pip
run: pip install -r requirements.txt
name: Extract, load and transform
run: python ingestion.py
name: Data quality tests
run: pytest -q
name: Train and evaluate models
run: python train.py
name: Upload results
uses: actions/upload-artifact@v4
with:
  name: model-results
  path: |
    metrics.json
    predictions.png

  docker:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      
uses: actions/checkout@v4
run: docker build -t heraklion-weather .
